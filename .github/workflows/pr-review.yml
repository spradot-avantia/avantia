name: Claude Code PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Revisión de Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Revisá el diff de este Pull Request. Prestá especial atención a:
            - Cualquier tabla nueva en db/schema.sql o db/migrations/ sin su
              política de Row-Level Security (RLS) por tenant_id.
            - Uso de apps/api/src/lib/supabase/admin.ts (service role) fuera
              de código estrictamente interno del backend.
            - Consultas a Supabase que no filtren explícitamente por
              tenant_id a nivel de aplicación.
            Comentá directamente en el PR con los hallazgos.
